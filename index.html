<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" />
    <title>Ocqita</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
        color: #333;
      }

      header {
        background-color: #4a90e2;
        color: white;
        text-align: center;
        padding: 2rem 0;
      }

      nav {
        background-color: #333;
        text-align: center;
      }

      nav a {
        color: white;
        text-decoration: none;
        padding: 15px 20px;
        display: inline-block;
      }

      nav a:hover {
        background-color: #575757;
      }

      section {
        padding: 40px;
        max-width: 900px;
        margin: auto;
      }

      .about,
      .projects,
      .contact {
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
        padding: 20px;
      }

      .project {
        margin-bottom: 15px;
      }

      footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Ocqita</h1>
      <p>Web Developing | Designing | Tech Enthusiasm</p>
    </header>
  </body>
</html>
